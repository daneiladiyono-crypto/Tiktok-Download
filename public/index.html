<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2433e6">
<title>Neel Downloader – Unduh video TikTok tanpa watermark</title>
<meta name="description" content="Tempel link TikTok, lalu unduh video tanpa watermark, foto slideshow, atau audio MP3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2433e6; --blue-deep:#1a26b8; --ink:#0c1033; --paper:#f2f3f7;
  --hi:#ffe14d; --mute:#5a5f8c;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --print:"Courier Prime","Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blue);color:var(--paper);font-family:var(--display);font-size:1rem;line-height:1.5;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 20px 56px}

/* latar: titik halftone ala cetak risograf, makin pudar ke bawah */
body{background:linear-gradient(180deg,var(--blue) 0%,var(--blue) 45%,var(--blue-deep) 100%) fixed}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.28) 2px,transparent 2.6px) 0 0/18px 18px;
  -webkit-mask-image:radial-gradient(120% 70% at 100% 0%,#000 0%,rgba(0,0,0,.35) 45%,transparent 75%);
  mask-image:radial-gradient(120% 70% at 100% 0%,#000 0%,rgba(0,0,0,.35) 45%,transparent 75%)}

/* header */
.top{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 36px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.ver{font-size:.875rem;opacity:.75}

/* hero */
h1{margin:0 0 18px;font-weight:800;font-variation-settings:"wdth" 78;font-size:clamp(3rem,15vw,6.75rem);line-height:.9;letter-spacing:-.035em}
.lead{margin:0 0 28px;max-width:34ch;font-size:1.125rem;opacity:.9}

.form{display:flex;flex-direction:column;gap:10px}
.field{width:100%;padding:18px 16px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font-size:1.125rem;font-weight:500}
.field::placeholder{color:#7c80a8}
.go{padding:17px 20px;border:3px solid var(--ink);border-radius:6px;background:var(--hi);color:var(--ink);font-weight:800;font-size:1.125rem;cursor:pointer;transition:transform .12s}
.go:active{transform:translateY(2px)}
.go:disabled{opacity:.6;cursor:wait}
@media(min-width:560px){.form{flex-direction:row}.go{flex:none}}
